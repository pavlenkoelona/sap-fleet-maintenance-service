<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet Maintenance Control</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">SAP-inspired operations portfolio</p>
      <h1>Fleet Maintenance Control</h1>
      <p>Work-order priorities, deadlines and cost exposure in one operational view.</p>
    </header>
    <section class="kpis" id="kpis" aria-label="Key performance indicators"></section>
    <section class="panel">
      <div class="toolbar">
        <h2>Work orders</h2>
        <label>Status
          <select id="statusFilter">
            <option value="">All</option>
            <option>OPEN</option><option>IN_PROGRESS</option><option>COMPLETED</option>
          </select>
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Order</th><th>Vehicle</th><th>Depot</th><th>Fault</th><th>Priority</th><th>Status</th><th>Planned end</th><th>Cost</th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
